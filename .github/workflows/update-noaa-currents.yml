name: Update NOAA Bellingham Currents

on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bellingham-noaa-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NOAA data libraries
        run: python -m pip install --disable-pip-version-check numpy requests netCDF4
      - name: Download NOAA forecasts, extract currents and surface temperature
        run: |
          python scripts/update_noaa_with_temperature.py \
            --hours '3,6,9,12,15,18,21,24,27' \
            --output currents-candidate.json \
            --temp-output water-temp-candidate.json
      - name: Validate currents against published forecast
        id: compare
        run: |
          python scripts/validate_sscofs.py \
            --candidate currents-candidate.json \
            --existing currents-live-data.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Validate temperature separately
        id: temperature
        run: |
          python scripts/validate_temperature.py \
            --candidate water-temp-candidate.json \
            --existing water-temp-model.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish validated updates only
        if: steps.compare.outputs.publish == 'true' || steps.temperature.outputs.publish == 'true'
        run: |
          if [ '${{ steps.compare.outputs.publish }}' = 'true' ]; then
            mv currents-candidate.json currents-live-data.json
          fi
          if [ '${{ steps.temperature.outputs.publish }}' = 'true' ]; then
            mv water-temp-candidate.json water-temp-model.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f currents-live-data.json ]; then git add currents-live-data.json; fi
          if [ -f water-temp-model.json ]; then git add water-temp-model.json; fi
          if git diff --cached --quiet; then
            echo 'Content unchanged; no commit.'
          else
            git commit -m 'Update NOAA Bellingham current and temperature forecasts'
            git push origin HEAD:main
          fi
      - name: Report no change
        if: steps.compare.outputs.publish != 'true' && steps.temperature.outputs.publish != 'true'
        run: echo 'No newer NOAA forecast data; existing files preserved.'
