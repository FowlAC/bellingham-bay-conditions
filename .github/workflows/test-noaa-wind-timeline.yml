name: Test NOAA Bellingham 24-Hour Wind Timeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wind-timeline-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy netCDF4 requests
      - name: Validate timeline logic
        run: python scripts/test_sscofs_wind_timeline.py --self-test
      - name: Download and extract nine NOAA wind snapshots
        run: python scripts/test_sscofs_wind_timeline.py --out wind-timeline-pilot.json
      - name: Upload pilot report - no publication
        uses: actions/upload-artifact@v4
        with:
          name: bellingham-24-hour-wind-pilot
          path: wind-timeline-pilot.json
          if-no-files-found: error
          retention-days: 7
