name: Test NOAA Bellingham Wind Map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NOAA data libraries
        run: python -m pip install --disable-pip-version-check numpy requests netCDF4
      - name: Validate extractor without network
        run: python scripts/build_wind_map_preview.py --self-test
      - name: Download and validate nine NOAA forecast fields
        run: python scripts/build_wind_map_preview.py --out wind-map-preview-data.json
      - name: Upload manual-test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: bellingham-wind-map-preview-data
          path: wind-map-preview-data.json
          if-no-files-found: error
          retention-days: 7
